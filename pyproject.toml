[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tripsight"
version = "0.1.0"
description = "可靠的旅行行程规划 Agent：大模型提出修改，确定性代码排程、核查营业时间与路线、记版本并可撤销"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "mcp>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
bills = ["openpyxl>=3.1", "numbers-parser>=4"]    # 可选：读微信/支付宝账单（.xlsx / .numbers）
photos = ["osxphotos>=0.70"]                  # 可选：Mac 上直接读照片 App 的相册（只读）
video = ["pyJianYingDraft"]                     # 可选：粗剪后同时生成剪映草稿（另需本机装 ffmpeg）
image = ["playwright>=1.40", "pillow>=10"]     # 可选：export_share 长图（playwright）、照片去定位（pillow）

[project.scripts]
tripcore = "tripcore.cli:main"
tripcore-mcp = "tripcore.mcp_server:main"

[project.urls]
Homepage = "https://github.com/lvshangke/TripSight"

[tool.setuptools.packages.find]
include = ["tripcore*"]

[tool.setuptools.package-data]
tripcore = ["assets/*"]
